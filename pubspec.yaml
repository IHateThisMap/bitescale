name: flutter_calorie_couinter_exercise_app
description: "BiteScale: track your weight, calories and food."
publish_to: 'none'

# version: <shown to users>+<build number>. Raise the build number for
# every APK you hand out, or Android refuses to install it as an update.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0          # Weight graph and calorie pie chart
  shared_preferences: ^2.5.6 # Saves all data on the phone
  intl: ^0.20.3             # Number and date formatting, translations
  image_picker: ^1.2.4      # Food photos from camera or gallery
  path_provider: ^2.1.6     # Where food photos are stored
  file_picker: ^13.1.0      # Choosing a food file to import
  share_plus: ^13.3.1       # Sending food files to other people

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  share_plus_platform_interface: ^7.2.0 # Lets tests fake the share menu

flutter:
  uses-material-design: true
  generate: true # Builds lib/l10n/app_localizations*.dart from the .arb files

# App icon. The images are drawn by tool/icon/render_icon_test.dart.
# Regenerate with:
#   flutter test tool/icon/render_icon_test.dart
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: "launcher_icon"
  adaptive_icon_background: "#00897B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#00897B"
    theme_color: "#00897B"
